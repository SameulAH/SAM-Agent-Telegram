name: CI

on:
  push:
    branches: [ main, develop, Telegram-agent-phase1 ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.11"
  # All backends set to stub so CI needs no external services
  LLM_BACKEND: stub
  STM_BACKEND: sqlite
  LTM_BACKEND: stub
  STT_ENABLED: "false"
  TTS_ENABLED: "false"
  TRACER_BACKEND: noop
  LOCAL_OBSERVABILITY_ENABLED: "false"
  TELEGRAM_BOT_TOKEN: test-token-for-ci
  TELEGRAM_BOT_USERNAME: sam_test_bot
  DATABASE_PATH: ":memory:"
  SQLITE_DB_PATH: ":memory:"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install ruff black

      - name: Run ruff (fast linter)
        run: ruff check . --select E,F,W,I --ignore E501

      - name: Check formatting (black)
        run: black --check --line-length 100 .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --timeout=30 --tb=short -p no:cacheprovider

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests (stub backends only)
        run: |
          pytest tests/integration/ -v --timeout=60 --tb=short -p no:cacheprovider -x

  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run transport and MCP contract tests
        run: |
          pytest tests/transport/ tests/mcp/ tests/observability/ tests/prompting/ \
            -v --timeout=30 --tb=short -p no:cacheprovider

  build:
    runs-on: ubuntu-latest
    needs: [ lint, unit-tests, integration-tests, contract-tests ]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (CPU target)
        run: |
          docker build \
            -f docker/Dockerfile.agent \
            --target final-base \
            --build-arg INSTALL_WHISPER=false \
            --build-arg INSTALL_COQUI=false \
            -t sam-agent:ci \
            .

      - name: Smoke-test the Docker image
        run: |
          docker run --rm \
            -e LLM_BACKEND=stub \
            -e STT_ENABLED=false \
            -e TTS_ENABLED=false \
            -e LTM_BACKEND=stub \
            -e TELEGRAM_BOT_TOKEN=test-token \
            sam-agent:ci \
            python -c "from agent.api import create_app; app = create_app(); print('App created OK')"
